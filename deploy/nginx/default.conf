# Same-origin reverse proxy for the TripWise stack.
#
# The browser only ever talks to this server, so the Secure/HttpOnly/SameSite=Lax session
# cookie and the double-submit CSRF cookie behave exactly as designed (no cross-origin
# requests, no CORS relaxation):
#
#   /api/*  -> FastAPI backend, with the /api prefix stripped (backend routes such as
#              /plan and /plan/{job_id} would otherwise collide with the UI's /plan pages)
#   /*      -> Next.js frontend
#
# TLS is NOT terminated here. The session cookies are marked Secure; browsers accept
# them over plain http only for http://localhost, which is what this local profile uses.
# Any real hostname must be served over HTTPS (see docs/DEPLOYMENT.md).
server_tokens off;

# Docker's embedded DNS. Upstream names are resolved at REQUEST time (variables below), so a
# backend or frontend that comes back from a restart with a new address is picked up within
# seconds instead of leaving the proxy pointing at a stale address until it is restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    set $tripwise_backend  http://backend:8000;
    set $tripwise_frontend http://frontend:3000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # FastAPI's interactive docs assume they live at the site root (they fetch /openapi.json),
    # so they are broken under the /api prefix and are not a product surface. Hidden here;
    # the machine-readable schema stays available at /api/openapi.json.
    location ~ ^/api/(docs|redoc)(/|$) {
        return 404;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $tripwise_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $tripwise_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
