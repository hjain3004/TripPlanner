# Same-origin reverse proxy for the TripWise stack.
#
# The browser only ever talks to this server, so the Secure/HttpOnly/SameSite=Lax session
# cookie and the double-submit CSRF cookie behave exactly as designed (no cross-origin
# requests, no CORS relaxation):
#
#   /api/*  -> FastAPI backend, with the /api prefix stripped (backend routes such as
#              /plan and /plan/{job_id} would otherwise collide with the UI's /plan pages)
#   /*      -> Next.js frontend
#
# TLS is NOT terminated here. The session cookies are marked Secure; browsers accept
# them over plain http only for http://localhost, which is what this local profile uses.
# Any real hostname must be served over HTTPS (see docs/DEPLOYMENT.md).
server_tokens off;

upstream tripwise_backend {
    server backend:8000;
    keepalive 16;
}

upstream tripwise_frontend {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://tripwise_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://tripwise_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
