# TripWise - production-like LOCAL stack (single instance, sample mode).
#
#   make compose-up         # build + start, waits for health, http://localhost:8080
#   make d1-smoke           # genuine full-stack smoke incl. backend restart + persistence
#   make compose-down       # stop (the data volume is kept)
#
# This is NOT a horizontally scalable deployment: the databases are SQLite files and
# planning jobs live in one process's memory, so backend must stay at exactly one replica.
# See docs/DEPLOYMENT.md for what has to change before that can be true.
name: tripwise-d1

services:
  backend:
    build:
      context: ../backend
    image: tripwise-backend:d1
    init: true
    restart: unless-stopped
    # Optional, names + explanations only in deploy/.env.example. Absent file is fine.
    env_file:
      - path: .env
        required: false
    environment:
      TRIPWISE_ENV: production
      TRIPWISE_DATA_DIR: /data
    volumes:
      - tripwise-data:/data
    # uvicorn drains for up to 10 s on SIGTERM; give Docker longer than that before SIGKILL.
    stop_grace_period: 30s
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]   # no route to the internet: no live provider can be reached
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  frontend:
    build:
      context: ../frontend
      args:
        # Compiled into the browser bundle at build time; public by definition.
        NEXT_PUBLIC_API_MODE: ${TRIPWISE_FRONTEND_API_MODE:-live}
        NEXT_PUBLIC_API_BASE_URL: /api
    image: tripwise-frontend:d1
    init: true
    restart: unless-stopped
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1000,gid=1000,mode=0755,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  proxy:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Loopback only: this local profile is never exposed to the network.
      - "127.0.0.1:${TRIPWISE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  edge: {}
  internal:
    internal: true   # backend and frontend have NO outbound network access

volumes:
  tripwise-data: {}
