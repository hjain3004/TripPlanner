[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwise-backend"
version = "0.1.0"
description = "Trip-first travel rewards optimizer — deterministic kernel (Milestone 1)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.116",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "hypothesis>=6.98",
    "types-PyYAML>=6.0",
    "httpx>=0.28",
]

[tool.setuptools]
# Flat-layout packages that live directly under backend/ (gate commands run from backend/).
packages = ["core", "core.optimizer", "core.transfer", "core.itinerary", "agents", "api", "evals",
            "gateway", "gateway.evidence", "gateway.places", "gateway.places.adapters",
            "gateway.catalog"]

[tool.setuptools.package-data]
"core" = ["seeds/*.yaml"]
"agents" = ["config.yaml"]
"evals" = ["golden/*.yaml", "golden/*.txt"]
"gateway.places" = ["fixtures/*.json"]
"gateway.catalog" = ["fixtures/*.json", "fixtures/*.yaml", "fixtures/hostile/*"]

[tool.pytest.ini_options]
testpaths = ["evals"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
strict = true
# core/ is pure and fully typed; third-party stubs handled where needed.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# report.py holds the evaluation report as a triple-quoted markdown template.
# Wrapping those lines inserts newlines into the generated report text, which
# test_m3_itinerary_eval asserts on, and a `# noqa` inside the literal would
# itself become report content. Line length is output-significant here.
"evals/report.py" = ["E501"]
# UP042 wants `class PipelineStatus(str, Enum)` rewritten as `StrEnum`. That is
# not cosmetic: str(PipelineStatus.X) yields "PipelineStatus.X" under (str, Enum)
# and "X" under StrEnum, so the rewrite can change API serialization. This is
# pre-existing M2 code with a frozen OpenAPI contract — changing it is its own
# task with its own contract-drift check, not a lint fix.
"agents/models.py" = ["UP042"]
