    - id: O1
      title: 10% instant off Agoda hotels
      kind: instant_discount
      card_ids: [globesaver]
      merchant: Agoda
      channels: [ota_generic]
      categories: [hotels]
      discount_bp: 1000
      max_discount_minor: 300000
      min_txn_minor: 1500000
      currency: INR
      valid_to: 2026-12-31
      stacking_class: bank_offer
    - id: O2
