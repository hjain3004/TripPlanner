# Golden #1 — the canonical worked example (spec 02 §8). Provenance auto-injected.
name: demo_trip
booking_date: 2026-07-24
trip_start_date: 2026-08-15
kb:
  cards:
    - id: voyager-prime
      issuer: Voyager Bank
      network: visa
      country: IN
      name: Voyager Prime
      annual_fee_minor: 0
      fee_currency: INR
      forex_markup_bp: 350
      forex_markup_tax_bp: 1800
      base_earn: { points: 2, per_amount_minor: 10000, currency: INR }
    - id: globesaver
      issuer: Globe Bank
      network: mastercard
      country: IN
      name: Globesaver
      annual_fee_minor: 0
      fee_currency: INR
      forex_markup_bp: 100
      forex_markup_tax_bp: 1800
      base_earn: { points: 1, per_amount_minor: 10000, currency: INR }
  reward_rules:
    - id: R1
      card_id: voyager-prime
      description: 10 pts per Rs100 on flights & hotels via bank portal (shared cap)
      earn: { points: 10, per_amount_minor: 10000, currency: INR }
      categories: [flights, hotels]
      channels: [bank_portal]
      cap: { max_points: 4000, period: statement_cycle, shared_cap_group: portal }
    - id: R2
      card_id: globesaver
      description: 5 pts per Rs100 on dining & general forex (any channel)
      earn: { points: 5, per_amount_minor: 10000, currency: INR }
