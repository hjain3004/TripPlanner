      kind: instant_discount
      networks: [visa]
      merchant: Klook
      channels: [ota_generic]
      categories: [attractions]
      discount_bp: 500
      max_discount_minor: 50000
      currency: INR
      valid_to: 2026-12-31
      stacking_class: bank_offer
