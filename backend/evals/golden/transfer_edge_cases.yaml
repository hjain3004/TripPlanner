cases:
  - name: increment_rounding
    programs:
      - id: lionmiles
        kind: airline
        name: LionMiles
        booking_url: https://example.test/lionmiles
    edges:
      - id: E1
        from_id: voyager-prime
        to_id: lionmiles
        ratio_from: 1
        ratio_to: 1
        min_transfer: 1000
        increment: 500
        transfer_time_hours_typical: 0
        transfer_time_hours_max: 0
    awards:
      - id: award
        program_id: lionmiles
        origin: DEL
        destination: SIN
        cabin: business
        trip_type: round_trip
        miles_cost: 123700
        fees_minor: 0
        fees_currency: INR
    target: {origin: DEL, destination: SIN, cabin: business, trip_type: round_trip, travelers: 1}
    wallet: {card_ids: [voyager-prime], points_balances: {voyager-prime: 124000}}
    baseline_valuations: {voyager-prime: 1000000}
    cash_price_minor: 20000000
    on_date: 2026-07-24
    expect: {points_consumed: 124000, leftover_miles: 300}

