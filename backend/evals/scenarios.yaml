scenarios:
  - id: "01_happy_path_singapore"
    name: "Clean happy path Singapore"
    request: "Plan a 4 night trip from Delhi to Singapore for 2 people starting 2026-09-01. Balanced style. We like food and nature. I have the HDFC Infinia card."
    expect: "ok"
    notes: "Baseline clean request with explicit route, dates, travelers, style, interests, and owned card."

  - id: "02_missing_dates"
    name: "Missing trip dates"
    request: "Plan a trip from Delhi to Singapore for 2 people. Balanced style, food and nature, using HDFC Infinia."
    expect: "needs_clarification"
    notes: "Dates are required for booking, award fee, and per-diem estimation."

  - id: "03_no_card_mentioned"
    name: "No card mentioned in prompt"
    request: "Plan a 4 night trip from Delhi to Singapore for 2 people starting 2026-09-01. Balanced style, food and nature."
    expect: "ok"
    notes: "Wallet should default to empty/standard rather than failing intake."

  - id: "04_unknown_card"
    name: "Unknown fictional card"
    request: "Plan a 4 night trip from Delhi to Singapore starting 2026-09-01 for 2 people. I have the SuperJupiter Quantum Black card."
    expect: "needs_clarification"
    notes: "Card is not in the knowledge base; intake should flag unknown card."

  - id: "05_unsupported_destination"
    name: "Unsupported destination corridor"
    request: "Plan a 4 night trip from Delhi to Tokyo starting 2026-09-01 for 2 people with HDFC Infinia."
    expect: "needs_clarification"
    notes: "Tokyo is not registered in regions.yaml / supported routes."

  - id: "06_unsupported_budget_mumbai"
    name: "Mumbai trip with budget unsupported"
    request: "Plan a 3 night trip from Delhi to Mumbai starting 2026-09-01 for 2 people with Axis Atlas card. Food and culture interests."
    expect: "ok"
    notes: "BOM is a registered region with budget_supported=false; capability should report known gaps."

  - id: "07_unsupported_budget_paris"
    name: "Paris trip with budget unsupported"
    request: "Plan a 4 night trip from Delhi to Paris starting 2026-09-01 for 2 people with HDFC Infinia card. Art and dining."
    expect: "ok"
    notes: "PAR is a registered region; pipeline should succeed and report capability."

  - id: "08_one_night_trip"
    name: "One night short trip"
    request: "Quick 1 night trip from Delhi to Singapore starting 2026-09-01 for 1 person with HDFC Infinia. Food interest."
    expect: "ok"
    notes: "Shortest valid trip duration (1 night / 2 days)."

  - id: "09_long_trip_12_nights"
    name: "Long trip 12 nights"
    request: "12 night comprehensive vacation from Delhi to Singapore starting 2026-09-01 for 2 people with HDFC Infinia and Axis Atlas cards. Food, culture, and nature."
    expect: "ok"
    notes: "12 nights stress-tests day generation and budget scaling."

  - id: "10_contradictory_constraints"
    name: "Contradictory budget constraint"
    request: "Strict luxury 5-star trip from Delhi to Singapore starting 2026-09-01 with maximum total budget of 5000 INR for 4 people with HDFC Infinia."
    expect: "ok"
    notes: "Impossible budget for 4 people luxury; critic/optimizer should handle without crashing."

  - id: "11_casual_slang_lowercase"
    name: "Casual lowercase fast typing"
    request: "delhi to singapore sep 1 to 5 2 ppl infinia card food street eats chill vibe"
    expect: "ok"
    notes: "Informal phrasing, lowercase, abbreviations (ppl, sep, chill vibe)."

  - id: "12_nonexistent_venue"
    name: "Request naming a nonexistent hallucinated venue"
    request: "4 nights in Singapore from Delhi starting 2026-09-01 for 2 with HDFC Infinia. We definitely must visit the Atlantis Underwater Pyramid of Jurong."
    expect: "ok"
    notes: "Hallucinated venue must not trip the place gateway or violate catalog referential integrity."

  - id: "13_solo_dubai_trip"
    name: "Dubai solo trip"
    request: "Solo 3 night trip from Mumbai to Dubai starting 2026-09-01 with Axis Atlas card. Architecture and dining."
    expect: "ok"
    notes: "BOM->DXB corridor with solo traveler."

  - id: "14_missing_origin"
    name: "Missing origin city"
    request: "Plan 4 nights in Singapore starting 2026-09-01 for 2 people with HDFC Infinia. Food and nature."
    expect: "needs_clarification"
    notes: "Origin city is missing; intake cannot determine route."
